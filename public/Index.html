<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Calculator Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <div class="max-w-4xl mx-auto p-6 mt-10">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-lg shadow">
            <h1 class="text-2xl font-bold text-gray-800">Advanced Calculator App</h1>
            <button id="logoutBtn" class="hidden bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Logout</button>
        </header>

        <!-- Notification Banner -->
        <div id="notification" class="hidden p-4 mb-4 rounded-lg text-center font-semibold"></div>

        <!-- Auth Section -->
        <div id="authSection" class="bg-white p-8 rounded-lg shadow-md max-w-md mx-auto">
            <h2 class="text-xl font-bold mb-4" id="authTitle">Login</h2>
            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700">Username</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border rounded focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-gray-700">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded focus:outline-none focus:border-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-bold">Submit</button>
            </form>
            <p class="mt-4 text-center text-sm text-gray-600">
                <span id="authToggleText">Need an account?</span> 
                <button id="toggleAuthMode" class="text-blue-600 hover:underline">Register here</button>
            </p>
        </div>

        <!-- App Section -->
        <div id="appSection" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Calculator -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">Calculator</h2>
                <form id="calcForm" class="space-y-4">
                    <div class="flex space-x-4">
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm">Number 1 (a)</label>
                            <input type="number" id="numA" class="w-full px-3 py-2 border rounded" required>
                        </div>
                        <div class="w-1/2">
                            <label class="block text-gray-700 text-sm">Number 2 (b)</label>
                            <input type="number" id="numB" class="w-full px-3 py-2 border rounded" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm">Operation</label>
                        <select id="operation" class="w-full px-3 py-2 border rounded">
                            <option value="add">Addition (+)</option>
                            <option value="subtract">Subtraction (-)</option>
                            <option value="multiply">Multiplication (*)</option>
                            <option value="division">Division (/)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 font-bold">Calculate</button>
                </form>
                
                <div class="mt-6 p-4 bg-gray-50 border rounded text-center">
                    <span class="text-gray-500 text-sm block mb-1">Result</span>
                    <span id="calcResult" class="text-3xl font-bold text-gray-800">-</span>
                </div>
            </div>

            <!-- History Panel -->
            <div class="bg-white p-6 rounded-lg shadow-md flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-bold">History</h2>
                    <div class="space-x-2">
                        <button id="refreshHistoryBtn" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">Refresh</button>
                    </div>
                </div>
                <div id="historyList" class="flex-1 overflow-y-auto space-y-2 max-h-80">
                    <p class="text-gray-500 text-sm text-center mt-10">No history loaded.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        let token = localStorage.getItem('calc_token');

        const authSection = document.getElementById('authSection');
        const appSection = document.getElementById('appSection');
        const logoutBtn = document.getElementById('logoutBtn');
        const notification = document.getElementById('notification');
        const historyList = document.getElementById('historyList');

        if (token) {
            showApp();
            fetchHistory();
        }

        function showNotification(msg, isError = false) {
            notification.textContent = msg;
            notification.className = `p-4 mb-4 rounded-lg text-center font-semibold block ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            setTimeout(() => notification.className = 'hidden', 3000);
        }

        document.getElementById('toggleAuthMode').addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').textContent = isLoginMode ? 'Login' : 'Register';
            document.getElementById('authToggleText').textContent = isLoginMode ? 'Need an account?' : 'Already have an account?';
            e.target.textContent = isLoginMode ? 'Register here' : 'Login here';
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = isLoginMode ? '/login' : '/register';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || data.message || 'Authentication failed');

                showNotification(data.message);
                if (isLoginMode && data.token) {
                    token = data.token;
                    localStorage.setItem('calc_token', token);
                    showApp();
                    fetchHistory();
                } else {
                    document.getElementById('toggleAuthMode').click(); 
                }
            } catch (err) {
                showNotification(err.message, true);
            }
        });

        logoutBtn.addEventListener('click', () => {
            token = null;
            localStorage.removeItem('calc_token');
            authSection.classList.remove('hidden');
            appSection.classList.add('hidden');
            logoutBtn.classList.add('hidden');
        });

        function showApp() {
            authSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            appSection.classList.add('grid');
            logoutBtn.classList.remove('hidden');
        }

        document.getElementById('calcForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const a = document.getElementById('numA').value;
            const b = document.getElementById('numB').value;
            const operation = document.getElementById('operation').value;

            try {
                const res = await fetch('/math', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ a, b, operation })
                });
                
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error || 'Calculation failed');

                if (typeof data.result === 'object' && data.result !== null) {
                    document.getElementById('calcResult').textContent = `Q: ${data.result.quotient}, R: ${data.result.remainder}`;
                } else {
                    document.getElementById('calcResult').textContent = data.result;
                }
                
                fetchHistory();
            } catch (err) {
                showNotification(err.message, true);
                document.getElementById('calcResult').textContent = 'Error';
            }
        });

        async function fetchHistory() {
            try {
                const res = await fetch('/history', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error || 'Failed to load history');
                
                historyList.innerHTML = '';
                if (data.history.length === 0) {
                    historyList.innerHTML = '<p class="text-gray-500 text-sm text-center mt-10">No calculations yet.</p>';
                    return;
                }

                data.history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'p-3 bg-gray-50 border rounded text-sm flex justify-between items-center';
                    
                    let resultText = (typeof item.result === 'object' && item.result !== null)
                        ? `Q: ${item.result.quotient}, R: ${item.result.remainder}` 
                        : item.result;
                    let opSymbol = { 'add': '+', 'subtract': '-', 'multiply': '*', 'division': '/' }[item.operation] || item.operation;
                    
                    div.innerHTML = `
                        <span class="font-mono text-gray-700">${item.num1} ${opSymbol} ${item.num2}</span>
                        <span class="font-bold text-blue-600">= ${resultText}</span>
                    `;
                    historyList.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                if (err.message.includes('NO token') || err.message.includes('cant verify')) {
                    logoutBtn.click();
                }
            }
        }

        document.getElementById('refreshHistoryBtn').addEventListener('click', fetchHistory);
    </script>
</body>
</html>
